<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root{--bg:#f6f7f7;--panel:#fff;--text:#222629;--muted:#717b81;--line:#e1e5e7;--teal:#08747f;--teal-soft:#dff4f6;--danger:#9f2533;--radius:8px;--shadow:0 18px 45px rgba(24,35,41,.12)}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);color:var(--text);display:grid;place-items:center;padding:22px}
        .login{width:min(100%,420px)}
        .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
        .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#3b4448;color:white;font-weight:700;font-size:13px}
        .brand strong{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
        .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
        h1{margin:0 0 6px;font-size:25px;line-height:1.15}p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.45}
        label{display:block;font-weight:700;font-size:13px;margin:14px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;font:inherit;background:white}
        input:focus{outline:2px solid var(--teal-soft);border-color:#9dd6dc}.btn{width:100%;border:0;background:var(--teal);color:white;border-radius:var(--radius);padding:12px 14px;min-height:44px;font:inherit;font-weight:700;cursor:pointer;margin-top:18px}
        .alert{border-radius:var(--radius);padding:11px 12px;font-size:14px;margin-bottom:14px}.alert.error{background:#fde7e9;color:var(--danger)}.alert.info{background:var(--teal-soft);color:#075f68}
        .public-link{display:block;text-align:center;color:var(--muted);font-size:13px;text-decoration:none;margin-top:16px}
    </style>
</head>
<body>
    <main class="login">
        <div class="brand">
            <div class="avatar">SE</div>
            <div>
                <strong>Silvia Espínola Business</strong>
                <span>Panel privado inmobiliario</span>
            </div>
        </div>
        <section class="panel">
            <h1>Acceso CRM</h1>
            <p>Ingresá con tu usuario para gestionar leads, clientes, tareas y oportunidades.</p>
            {% if expirado %}<div class="alert info">La sesión se cerró por inactividad. Volvé a ingresar.</div>{% endif %}
            {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
            <form method="post">
                <input type="hidden" name="next" value="{{ next_url }}">
                <label for="usuario">Usuario</label>
                <input id="usuario" name="usuario" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="btn" type="submit">Entrar al CRM</button>
            </form>
        </section>
        <a class="public-link" href="/">Volver a la web pública</a>
    </main>
</body>
</html>
